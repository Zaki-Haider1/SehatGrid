services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sehat_grid
      POSTGRES_USER: sehat_grid
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehat_grid -d sehat_grid"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sehat_grid:local_demo_only@db:5432/sehat_grid
      CORS_ORIGINS: http://localhost:3000
      APP_TIMEZONE: Asia/Karachi
      SEED_ON_START: "true"
      ENABLE_DEMO_RESET: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  postgres_data:
