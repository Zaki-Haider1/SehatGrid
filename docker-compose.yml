services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sehat_grid
      POSTGRES_USER: sehat_grid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sehat_grid -d sehat_grid"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sehat_grid:${POSTGRES_PASSWORD}@db:5432/sehat_grid
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      APP_TIMEZONE: Asia/Karachi
      CORS_ORIGINS: http://localhost:3000
      SEED_ON_START: "true"
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres_data:
