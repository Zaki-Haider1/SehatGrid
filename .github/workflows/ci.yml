name: Validate scoped MVP
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sehat_grid_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d sehat_grid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/sehat_grid_test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/sehat_grid_test
      JWT_SECRET: isolated-ci-only-signing-key-at-least-32-characters
      DEMO_PASSWORD: isolated-ci-demo-password
      SEED_ON_START: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: backend/models
          key: minilm-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - run: python scripts/preload_model.py
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: python scripts/evaluate_matching.py
      - run: python scripts/evaluate_allocation.py
      - name: Build backend-only deployment container from repository root
        working-directory: .
        run: docker build -f backend/Dockerfile -t sehat-grid-api .
      - name: Boot backend-only container against PostgreSQL
        working-directory: .
        run: |
          docker run -d --name sehat-grid-api --network host -e DATABASE_URL -e JWT_SECRET -e DEMO_PASSWORD -e SEED_ON_START=true sehat-grid-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs sehat-grid-api
          exit 1
      - name: Stop backend-only container
        if: always()
        working-directory: .
        run: docker rm -f sehat-grid-api || true
      - name: Save evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: outputs/*-results.json
      - name: Stop backend test container
        if: always()
        run: docker rm -f sehat-grid-api || true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
  combined-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete application
        run: docker build -t sehat-grid .
      - name: Cold-start with network disabled
        run: |
          docker run -d --name sehat-grid-offline --network none -e JWT_SECRET=isolated-ci-only-signing-key-at-least-32-characters -e DEMO_PASSWORD=isolated-ci-demo-password sehat-grid
          for attempt in $(seq 1 45); do
            if docker exec sehat-grid-offline python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:3000/health').read())"; then
              docker exec sehat-grid-offline python -c "import urllib.request; assert b'Sign in to the pilot' in urllib.request.urlopen('http://localhost:3000').read()"
              exit 0
            fi
            sleep 2
          done
          docker logs sehat-grid-offline
          exit 1
      - name: Stop offline container
        if: always()
        run: docker rm -f sehat-grid-offline || true
  browser-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated synthetic API
        run: |
          docker compose -p sehat-grid-browser -f docker-compose.browser.yml up -d --build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/health; then exit 0; fi
            sleep 2
          done
          docker compose -p sehat-grid-browser -f docker-compose.browser.yml logs
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          API_PROXY_TARGET: http://127.0.0.1:18000
      - run: npm run test:browser
        working-directory: frontend
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            frontend/test-results/
            frontend/playwright-report/
      - name: Stop isolated API
        if: always()
        run: docker compose -p sehat-grid-browser -f docker-compose.browser.yml down
