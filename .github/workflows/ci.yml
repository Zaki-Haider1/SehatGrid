name: Validate MVP
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sehat_grid_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d sehat_grid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/sehat_grid_test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/sehat_grid_test
      SEED_ON_START: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - name: Build deployment container
        run: docker build -t sehat-grid-api .
      - name: Boot deployment container against PostgreSQL
        run: |
          docker run -d --name sehat-grid-api --network host -e DATABASE_URL -e SEED_ON_START=true sehat-grid-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              curl --fail --silent http://localhost:8000/api/dashboard
              exit 0
            fi
            sleep 2
          done
          docker logs sehat-grid-api
          exit 1
      - name: Stop deployment container
        if: always()
        run: docker rm -f sehat-grid-api || true
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
